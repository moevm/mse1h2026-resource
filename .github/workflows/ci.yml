name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-lint:
    name: Backend · lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install ruff
      - run: ruff check app tests

  backend-tests:
    name: Backend · unit tests
    runs-on: ubuntu-latest
    needs: [backend-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install httpx
      - run: pytest -ra -v

  frontend-typecheck:
    name: Frontend · typecheck
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  frontend-build:
    name: Frontend · build (vite)
    runs-on: ubuntu-latest
    needs: [frontend-typecheck]
    defaults: { run: { working-directory: ./frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  sast-bandit:
    name: SAST · bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "bandit[toml]"
      - run: bandit -r app -c .bandit -ll

  sast-semgrep:
    name: SAST · semgrep (OWASP rules)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run semgrep
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/python \
            --config p/javascript \
            --config p/typescript \
            --config p/security-audit \
            --severity ERROR \
            --error \
            --metrics off \
            --exclude .venv \
            --exclude node_modules \
            --exclude frontend/dist

  sast-hadolint:
    name: SAST · hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/backend.Dockerfile
          failure-threshold: warning
          ignore: DL3008,DL3013,DL3018
      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/frontend.Dockerfile
          failure-threshold: warning
          ignore: DL3008,DL3013,DL3018

  sast-pip-audit:
    name: SAST · pip-audit (Python deps CVE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install pip-audit
      - run: pip-audit --requirement requirements.txt --strict

  sast-npm-audit:
    name: SAST · npm audit (frontend deps CVE)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  trivy-fs:
    name: Trivy · filesystem (CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

  trivy-image:
    name: Trivy · backend image (CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t resource-backend:ci -f app/backend.Dockerfile .
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: resource-backend:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

  smoke-test:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build
      - sast-bandit
      - sast-semgrep
      - sast-hadolint
      - sast-pip-audit
      - sast-npm-audit
      - trivy-fs
      - trivy-image
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: |
          cat > .env <<'EOF'
          NEO4J_URI=bolt://neo4j:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=changeme
          DEBUG=true
          NODE_TTL_HOURS=24
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=ci-redis-pw
          RAW_DATA_TTL_HOURS=24
          BACKEND_PORT=8000
          FRONTEND_PORT=3000
          EOF
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for backend /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Backend did not become healthy" >&2
          docker compose logs backend
          exit 1
      - name: Verify /health body
        run: curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'
      - name: Verify /openapi.json
        run: |
          curl -fsS http://127.0.0.1:8000/openapi.json \
            | python -c "import sys,json; d=json.load(sys.stdin); assert d['openapi'].startswith('3.'), d"
      - name: Verify default-admin login
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"admin"}' \
            | python -c "import sys,json; t=json.load(sys.stdin); assert 'access_token' in t and 'refresh_token' in t, t"
      - name: Verify frontend serves index
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs frontend
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v

  load-k6:
    name: Load test · k6
    runs-on: ubuntu-latest
    needs: [smoke-test]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: |
          cat > .env <<'EOF'
          NEO4J_URI=bolt://neo4j:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=changeme
          DEBUG=true
          NODE_TTL_HOURS=24
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=ci-redis-pw
          RAW_DATA_TTL_HOURS=24
          BACKEND_PORT=8000
          FRONTEND_PORT=3000
          EOF
      - run: docker compose up -d --build
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          docker compose logs backend
          exit 1
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
              --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
              | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -y
          sudo apt-get install -y k6
      - name: Run k6
        run: k6 run -e BASE_URL=http://127.0.0.1:8000 tests/load/api_smoke.js
      - name: Tear down
        if: always()
        run: docker compose down -v

  dast-zap:
    name: DAST · OWASP ZAP baseline
    runs-on: ubuntu-latest
    needs: [smoke-test]
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: |
          cat > .env <<'EOF'
          NEO4J_URI=bolt://neo4j:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=changeme
          DEBUG=true
          NODE_TTL_HOURS=24
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=ci-redis-pw
          RAW_DATA_TTL_HOURS=24
          BACKEND_PORT=8000
          FRONTEND_PORT=3000
          EOF
      - run: docker compose up -d --build
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          exit 1
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://127.0.0.1:8000/openapi.json"
          cmd_options: "-I -a"
          fail_action: false
          allow_issue_writing: false
      - name: Tear down
        if: always()
        run: docker compose down -v
