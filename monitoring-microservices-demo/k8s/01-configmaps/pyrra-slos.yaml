apiVersion: v1
kind: ConfigMap
metadata:
  name: pyrra-slos
  namespace: monitoring-demo
data:
  fastapi-api-availability.yaml: |
    apiVersion: pyrra.dev/v1alpha1
    kind: ServiceLevelObjective
    metadata:
      name: fastapi-api-availability
      namespace: monitoring-demo
    spec:
      target: '95'
      window: 1w
      indicator:
        ratio:
          errors:
            metric: http_requests_total{status=~"5..",handler!="/metrics"}
          total:
            metric: http_requests_total{handler!="/metrics"}
  fastapi-api-latency.yaml: |
    apiVersion: pyrra.dev/v1alpha1
    kind: ServiceLevelObjective
    metadata:
      name: fastapi-api-latency
      namespace: monitoring-demo
    spec:
      target: '95'
      window: 1w
      indicator:
        latency:
          success:
            metric: http_request_duration_seconds_bucket{job="fastapi-app",status!~"5..",handler!="/metrics",le="1.0"}
          total:
            metric: http_request_duration_seconds_count{job="fastapi-app",handler!="/metrics"}
