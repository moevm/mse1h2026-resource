apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: monitoring-demo
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'Observability'
      orgId: 1
      folder: ''
      type: 'file'
      disableDeletion: true
      editable: true
      options:
        path: '/etc/grafana/dashboards'
