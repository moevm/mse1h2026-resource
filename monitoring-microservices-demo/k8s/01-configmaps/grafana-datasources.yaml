apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring-demo
data:
  datasources.yaml: |
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
    datasources:
      - uid: prometheus
        orgId: 1
        name: Prometheus
        type: prometheus
        typeName: Prometheus
        access: proxy
        url: http://prometheus:9090
        password: ''
        user: ''
        database: ''
        basicAuth: false
        isDefault: true
        jsonData:
          exemplarTraceIdDestinations:
            - datasourceUid: tempo
              name: TraceID
          httpMethod: POST
        readOnly: false
        editable: true
      - uid: tempo
        orgId: 1
        name: Tempo
        type: tempo
        typeName: Tempo
        access: proxy
        url: http://tempo:3200
        password: ''
        user: ''
        database: ''
        basicAuth: false
        isDefault: false
        jsonData:
          nodeGraph:
            enabled: true
          serviceMap:
            datasourceUid: prometheus
          search:
            hide: false
          lokiSearch:
            datasourceUid: loki
          tracesToLogsV2:
            customQuery: true
            query: "{$${__tags}} | trace_id=`$${__trace.traceId}` |= \"\""
            datasourceUid: loki
            filterByTraceID: false
            spanEndTimeShift: "500ms"
            spanStartTimeShift: "-500ms"
            tags:
              - key: "service.name"
                value: "service_name"
          tracesToProfiles:
            customQuery: false
            datasourceUid: "pyroscope"
            profileTypeId: "process_cpu:cpu:nanoseconds:cpu:nanoseconds"
            tags:
              - key: "service.name"
                value: "service_name"
              - key: "http.route"
                value: "endpoint"
        readOnly: false
        editable: true
      - uid: loki
        orgId: 1
        name: Loki
        type: loki
        typeName: Loki
        access: proxy
        url: http://loki:3100
        password: ''
        user: ''
        database: ''
        basicAuth: false
        isDefault: false
        jsonData:
          httpMethod: GET
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: "trace_id"
              matcherType: "label"
              name: Tempo
              url: "$${__value.raw}"
              urlDisplayLabel: 'Tempo'
            - matcherRegex: "trace_id"
              matcherType: "label"
              name: Jaeger
              url: 'http://10.128.9.212:16686/trace/$${__value.raw}'
              urlDisplayLabel: 'Jaeger'
        readOnly: false
        editable: true
      - uid: jaeger
        orgId: 1
        name: Jaeger
        type: jaeger
        url: http://jaeger:16686/
        access: proxy
        readOnly: false
        editable: true
      - uid: pyroscope
        orgId: 1
        name: Pyroscope
        type: grafana-pyroscope-datasource
        access: proxy
        url: http://pyroscope:4040
