apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: monitoring-demo
spec:
  type: LoadBalancer
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: metrics
      port: 14269
      targetPort: 14269
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
