apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.59.0
          args: ["--query.ui-config=/etc/jaeger/jaeger-ui.json"]
          ports:
            - containerPort: 16686
            - containerPort: 14269
            - containerPort: 4317
            - containerPort: 4318
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: COLLECTOR_OTLP_GRPC_HOST_PORT
              value: ":4317"
            - name: COLLECTOR_OTLP_HTTP_HOST_PORT
              value: ":4318"
            - name: METRICS_STORAGE_TYPE
              value: prometheus
            - name: PROMETHEUS_SERVER_URL
              value: "http://prometheus:9090"
            - name: LOG_LEVEL
              value: debug
          volumeMounts:
            - name: ui-config
              mountPath: /etc/jaeger/jaeger-ui.json
              subPath: jaeger-ui.json
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: ui-config
          configMap:
            name: jaeger-ui-config
